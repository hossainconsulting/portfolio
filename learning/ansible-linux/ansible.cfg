# Defaults for the learning lab. Running ansible-playbook from this folder
# picks these up automatically, so no -i flag is needed.
[defaults]
inventory = inventory/hosts.ini
interpreter_python = auto_silent
# Keep runs readable: one line per task result rather than the full JSON blob.
stdout_callback = default
result_format = yaml
# Fail loudly on an unknown host key rather than silently trusting it.
# Add lab hosts to known_hosts once, by hand, in module 05.
host_key_checking = True
retry_files_enabled = False

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False

[ssh_connection]
pipelining = True
