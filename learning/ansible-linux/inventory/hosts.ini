# Lab inventory. Four local VMs; replace the addresses with your own.
# The control node is not listed - playbooks run from it, not against it.

[web]
web01 ansible_host=192.168.56.11
web02 ansible_host=192.168.56.12

[db]
db01 ansible_host=192.168.56.21

# Distro groups. Module 08 uses ansible_os_family facts instead of these,
# but having them in the inventory makes the difference easy to see.
[ubuntu]
web01
web02

[rocky]
db01

[lab:children]
web
db

[lab:vars]
ansible_user=deploy
ansible_ssh_private_key_file=~/.ssh/lab_ed25519
