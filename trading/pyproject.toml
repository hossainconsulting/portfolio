[project]
name = "tradelab"
version = "0.1.0"
description = "Research, data, backtesting, risk and trader-psychology toolkit behind the Hossain Consulting trading product."
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "numpy>=1.26", "pyarrow>=15", "yfinance>=0.2.50", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tradelab = "tradelab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tradelab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
